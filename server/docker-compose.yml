version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: aaledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeMe123}
      POSTGRES_DB: aaledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://aaledger:${DB_PASSWORD:-changeMe123}@db:5432/aaledger
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-in-production}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
